<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Farouk Pandor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/faroukpandor/assets/favicon.svg" type="image/svg+xml">
<style>
  :root { --paper:#f7f4ef; --ink:#15110d; --ink-3:#7c7268; --rule:#dcd4c8; --accent:#8a2b1b; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; align-content:center;
    background:var(--paper); color:var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { width:100%; max-width:1180px; margin-inline:auto; padding: 4rem clamp(1.15rem,4vw,3rem); }
  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin:0;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight:400; font-size: clamp(2.35rem, 1.1rem + 6vw, 4.6rem);
    line-height:1; letter-spacing:-.03em; margin:1.2rem 0 1.4rem;
  }
  p.lede { color:#4f4841; max-width:46ch; line-height:1.62; margin:0; font-size:1.05rem; }
  a.back {
    display:inline-block; margin-top:2.2rem; padding:.7rem 1.1rem;
    border:1px solid var(--ink); color:var(--ink); text-decoration:none;
    font-size:.9rem; border-radius:2px; transition:background .18s, color .18s;
  }
  a.back:hover, a.back:focus-visible { background:var(--ink); color:var(--paper); }
</style>
</head>
<body>
<main class="wrap" id="main">
  <p class="eyebrow">Error 404</p>
  <h1>This page moved,<br>or never existed.</h1>
  <p class="lede">Either way, nothing here is worth guessing at. The work, the enterprises and the evidence behind them are all on the front page.</p>
  <a class="back" id="home" href="/">Return to the front page</a>
</main>
<script>
  // Works whether the site is served from a domain root or a project subpath.
  (function () {
    var seg = location.pathname.split("/")[1];
    if (seg && seg.indexOf(".") === -1) {
      document.getElementById("home").setAttribute("href", "/" + seg + "/");
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.setAttribute("href", "/" + seg + "/assets/favicon.svg");
    }
  })();
</script>
</body>
</html>
