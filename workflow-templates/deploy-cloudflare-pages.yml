# Optional: deploy straight from GitHub Actions to Cloudflare Pages.
#
# This is NOT required — Cloudflare Pages can build and deploy this repo
# on its own once you connect it in the Cloudflare dashboard (see README.md).
#
# Only enable this workflow if you'd rather deploy from GitHub Actions
# using a Cloudflare API token. To use it:
#   1. Create a Cloudflare Pages project (dashboard -> Workers & Pages -> Create -> Pages).
#   2. Add repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#   3. Uncomment the "on:" triggers below.

name: Deploy to Cloudflare Pages (optional)

on:
  workflow_dispatch: {}
  # push:
  #   branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Build (release)
        run: trunk build --release

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dev-toolbox
